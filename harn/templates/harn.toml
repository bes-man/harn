# harn configuration for this project.

[harn]
# Project code used to auto-number tasks without a tracker key. Tasks are JSON
# files in harn_env/tasks/. With Jira/Linear, name a task by its key
# (AUTH-42.json); otherwise harn generates PRJ-001, PRJ-002, … from this prefix.
project = "prj"
# How self-directed the agent is, 0.0–1.0 (env override: HARN_AUTONOMY):
#   0.0–0.3  meticulous — clarifies almost everything via ask_user (tight control)
#   0.4–0.7  balanced   — decides routine/reversible things, asks on the big ones
#   0.8–1.0  creative   — decides for itself with best practices, rarely asks
# Lower = more questions (and higher accuracy on fuzzy specs); higher = fewer
# interruptions (and more agent initiative). Default 0.7.
autonomy = 0.7
# require_mcp (default true): `harn setup` / `harn doctor` insist the MCP server
# is actually enabled in your agent (Cursor needs a manual toggle) and re-check
# until you confirm — harn is useless to the agent until MCP is on. Set false to
# silence the check.
require_mcp = true
# Single agent (shorthand):
agent = "claude"           # claude | codex | cursor | antigravity | qwen
# Or several, tried in order — the first one installed runs. Whichever agent
# runs shares the SAME context (AGENTS.md, the task board, state/PROGRESS.md,
# state/ANSWERS.md, the MCP server), so it always knows what's done and planned.
# agents = ["claude", "codex", "cursor"]

[feedback]
# Language-agnostic feedback signal. Set this to your project's test command.
# Examples: "pytest -q"  |  "npm test"  |  "go test ./..."  |  "cargo test"
test_cmd = ""
# require_tests (default true): when a turn changes code files but touches no
# test files, harn feeds back ONE "write tests for this" nudge before the work
# can proceed to verify (once per task — it never loops forever on it).
require_tests = true

[loop]
max_iterations = 10
# loop_aware (default true): inject the task board, the shared progress log, and
# the lifecycle explanation into every prompt so the agent always sees the whole
# picture and you can watch the task move through its track inside the agent.
loop_aware = true
# verify (default true): after tests pass, run a dedicated verification turn that
# checks the work against the task's acceptance criteria (not just that tests
# pass). It fixes small gaps itself, or calls ask_user when a human decision is
# needed, before the task goes to review. Costs an extra agent turn per task.
verify = true
# Planning turn (default true): the very first agent turn for a new task is a
# planning pass — the agent reads the task and PRD, asks clarifying questions via
# ask_user, and writes unambiguous acceptance criteria back into the task JSON
# (using the `update_task` MCP tool). Code only starts on the NEXT iteration.
# Skip for trivial tasks or when criteria are already complete.
planning = true
# Oracle (default false): after verify passes, a second independent agent with
# a fresh context checks whether the work actually solves the problem and flags
# technical debt. ORACLE: FAIL → loops the task back for rework. ORACLE: DEBT →
# passes to review with a debt note for the human. Costs one extra agent turn.
oracle = true
oracle_agent = ""   # empty = same agent as [harn].agent; or set e.g. "claude"
# Design turn (default true): during planning of a USER-FACING task the agent
# generates a static HTML mockup of the interface (harn_env/design/<task>.html)
# and confirms it with you BEFORE any code is written. The approved mockup then
# becomes the visual contract for the executor, the oracle, and the browser
# verification phase.
design = true
# Autonomous mode (also: `harn run --auto` / `-a`). No human in the loop: the
# agent researches best practices and decides for itself instead of asking, over
# a larger iteration budget, and harn NEVER mutates harn_env .md files (no task
# statuses, no PROGRESS/notes) — code may change, the track stays pristine.
# Not recommended for complex tasks.
auto = false
auto_max_iterations = 30

[browser]
# Browser verification (default off): after tests + verify pass on a UI task
# (one with an approved design or the "ui" skill), harn starts your app, lets
# the agent drive it through the Playwright MCP server — walking the acceptance
# criteria like a real user and saving screenshots to
# harn_env/state/screenshots/<task>/ — then stops it. `UI: FAIL` loops the task
# back for rework. Enable, fill in the two values, and re-run `harn setup` so
# the Playwright MCP server is added to your agent's MCP config (needs Node.js).
enabled = false
# How to start the app (empty = it's already running at app_url):
app_cmd = ""               # e.g. "npm run dev"
app_url = ""               # e.g. "http://localhost:3000"
ready_timeout_s = 60       # how long to wait for app_url to answer after app_cmd

[notify]
idle_minutes = 30          # remind via Telegram/Slack if blocked this long
# Human-in-the-loop over Telegram (default true): when the agent blocks on a
# question OR finishes a task that needs review, harn posts it to Telegram and
# waits for your reply right there, then resumes automatically. This survives
# the computer going to sleep — Telegram retains the messages, so the wait picks
# up your answer on wake. Requires the Telegram env vars below.
wait_for_reply = true
wait_timeout_minutes = 0   # 0 = wait forever; otherwise fall back to the CLI path
# Where a blocking question goes:
#   "both"     — wait in the chat first, escalate to Telegram after the grace;
#   "chat"     — chat only, never Telegram;
#   "telegram" — straight to Telegram (no chat grace).
channel = "both"
# How long to wait for an answer IN THE CHAT before escalating to Telegram.
# Answer in either place and both resolve (the Telegram card is edited if the
# answer landed in the chat first). 0 = escalate immediately. Env override:
# HARN_CHAT_GRACE_MINUTES. For chat-driven runs (no `harn run`), keep a
# coordinator alive with `harn watch` so escalation still fires.
chat_grace_minutes = 5
# Secrets come from environment variables, not this file:
#   HARN_TELEGRAM_BOT_TOKEN, HARN_TELEGRAM_CHAT_ID, HARN_SLACK_WEBHOOK_URL

[code_search]
# Both backends default to on. `harn setup` auto-installs whichever is enabled
# here (semble via pip; SocratiCode prerequisites checked + npx cache warmed),
# wires them into the agent MCP configs, and injects guidance into the planning
# and oracle prompts. Disable either to skip it. Re-run `harn setup` after
# toggling. Use `harn setup --no-install` to skip the install step.

# semble — semantic chunk retrieval (Python `semble[mcp]`, installed by setup).
# Gives agents precise code snippets instead of reading whole files. No Docker.
semble = true

# SocratiCode — static dependency graph + blast-radius analysis.
# More precise than semble for "what breaks if X changes" questions.
# Fetched by npx on first use (pinned ^1.8). You only need Node.js + a running
# Docker daemon — SocratiCode then auto-pulls and starts its OWN Qdrant + Ollama
# containers on first use (~5 min, one time). You do NOT install Qdrant yourself.
# (Or skip Docker entirely with cloud: set EMBEDDING_PROVIDER + QDRANT_URL.)
# `harn setup` checks Docker and tells you. Source:
# https://github.com/giancarloerra/SocratiCode
socraticcode = true

[mcp]
# context7 (default true) — live, version-accurate library documentation as MCP
# tools (resolve-library-id / get-library-docs). The agent consults CURRENT API
# docs and best practices instead of stale training data. Needs Node.js (npx).
# Set false and re-run `harn setup` to remove it from the generated MCP config.
context7 = true

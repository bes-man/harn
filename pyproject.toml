[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harn"
version = "0.22.1"
description = "Agent-agnostic harness with a ralph-style feedback loop, on-demand skills and human-in-the-loop planning."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",          # MCP server (FastMCP); only needed for the `harn mcp` command
    "tomli>=2.0 ; python_version < '3.11'",
    "certifi>=2023.0",     # CA bundle for Telegram TLS (fixes macOS cert issues)
    "semble[mcp]>=0.3.0,<1.0",  # code search for agents; [mcp] ships the MCP server
]

[project.scripts]
harn = "harn.cli:main"

[tool.setuptools]
packages = ["harn", "harn.adapters"]
include-package-data = true

[tool.setuptools.package-data]
harn = ["templates/**/*", "templates/**/.*", "agent-api.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
